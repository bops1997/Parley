<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 280px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; color: #16161d; background: #fff; letter-spacing: -0.01em; }
  .top { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; }
  .orb { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #5B5BF5, #22C7E6); display: grid; place-items: center; }
  .orb svg { width: 16px; height: 16px; color: #fff; }
  .name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { padding: 0 16px 12px; font-size: 12.5px; color: #6b6b76; line-height: 1.45; }
  .row { padding: 10px 16px; border-top: 1px solid #f0f0f3; font-size: 13px; color: #16161d; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #12a37a; flex: 0 0 auto; }
  .dot.off { background: #c7c7cc; }
  .hint { padding: 12px 16px; font-size: 12px; color: #86868b; line-height: 1.5; background: #fbfbfd; border-top: 1px solid #f0f0f3; }
  b { font-weight: 600; }
</style>

<div class="top">
  <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v4"/></svg></div>
  <div class="name">Parley</div>
</div>
<div class="sub">The voice assistant you talk with. Click the pill on any page, speak, and your words land where your cursor is.</div>
<div class="row"><span class="dot" id="dot"></span><span id="status">Checking backend…</span></div>
<div class="hint">Make sure the Parley server is running: <b>node browser-server.js</b> in your terminal.</div>

<script>
  fetch("http://localhost:4141/", { method: "GET" })
    .then(() => { document.getElementById("status").textContent = "Backend connected"; })
    .catch(() => {
      document.getElementById("dot").classList.add("off");
      document.getElementById("status").textContent = "Backend not running";
    });
</script>
