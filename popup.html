<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --p-accent: #6366f1;
    --p-violet: #a78bfa;
    --p-cyan: #22d3ee;
    --p-text: #1d1d1f;
    --p-text-2: #6e6e73;
    --p-text-3: #aeaeb2;
    --p-border: rgba(0, 0, 0, 0.06);
    --p-spring: cubic-bezier(0.34, 1.45, 0.64, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    color: var(--p-text);
    background: linear-gradient(168deg, #fafafa 0%, #f4f4f8 55%, #eef0f8 100%);
    letter-spacing: -0.018em;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    padding: 20px 18px 14px;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.55) 100%);
    border-bottom: 1px solid var(--p-border);
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .orb {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, var(--p-accent) 0%, var(--p-violet) 55%, var(--p-cyan) 100%);
    display: grid; place-items: center;
    box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.45);
  }
  .orb svg { width: 17px; height: 17px; color: #fff; }
  .title-wrap { display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: 19px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; }
  .tag { font-size: 12px; color: var(--p-text-2); font-weight: 500; }
  .sub {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--p-text-2);
    line-height: 1.5;
  }

  .status-card {
    margin: 12px 14px 0;
    padding: 11px 14px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 4px 16px -8px rgba(15, 15, 45, 0.12);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 520;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4);
    animation: pulse 2s ease-in-out infinite;
    flex: 0 0 auto;
  }
  .dot.off { background: #c7c7cc; animation: none; box-shadow: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.35); }
    50% { box-shadow: 0 0 0 5px rgba(52, 211, 153, 0); }
  }

  .section { padding: 6px 14px 4px; }
  .section-label {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--p-text-3);
    padding: 10px 4px 6px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    margin-bottom: 6px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(0, 0, 0, 0.04);
    transition: background 0.2s, transform 0.2s var(--p-spring);
  }
  .toggle-row:hover { background: rgba(255, 255, 255, 0.88); }
  .toggle-row label { flex: 1; cursor: pointer; line-height: 1.35; font-size: 13px; font-weight: 520; }
  .toggle-row small { display: block; color: var(--p-text-2); font-size: 11.5px; font-weight: 450; margin-top: 3px; line-height: 1.4; }
  b { font-weight: 650; }

  /* iOS-style switch */
  .switch {
    position: relative;
    width: 46px;
    height: 28px;
    flex: 0 0 auto;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }
  .slider {
    position: absolute;
    inset: 0;
    cursor: pointer;
    background: #e5e5ea;
    border-radius: 999px;
    transition: background 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
    transition: transform 0.28s var(--p-spring);
  }
  .switch input:checked + .slider {
    background: linear-gradient(135deg, var(--p-accent), var(--p-violet));
  }
  .switch input:checked + .slider::before {
    transform: translateX(18px);
  }
  .switch input:focus-visible + .slider {
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  }

  .hint {
    margin: 8px 14px 14px;
    padding: 12px 14px;
    font-size: 11.5px;
    color: var(--p-text-2);
    line-height: 1.55;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.04);
  }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
    background: rgba(99, 102, 241, 0.08);
    color: var(--p-accent);
    padding: 2px 6px;
    border-radius: 5px;
  }
</style>

<div class="hero">
  <div class="top">
    <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v4"/></svg></div>
    <div class="title-wrap">
      <div class="name">Parley</div>
      <div class="tag">Voice writing assistant</div>
    </div>
  </div>
  <div class="sub">Settings sync across every tab and are saved automatically.</div>
</div>

<div class="status-card"><span class="dot" id="dot"></span><span id="status">Checking backend…</span></div>

<div class="section">
  <div class="section-label">Features</div>

  <div class="toggle-row">
    <label for="toggle-wake"><b>Hey Parley</b><small>Click the page once, then say “Hey Parley”.</small></label>
    <label class="switch"><input type="checkbox" id="toggle-wake"><span class="slider"></span></label>
  </div>
  <div class="toggle-row">
    <label for="toggle-field"><b>Field hint</b><small>Show a speak chip next to focused inputs.</small></label>
    <label class="switch"><input type="checkbox" id="toggle-field"><span class="slider"></span></label>
  </div>
  <div class="toggle-row">
    <label for="toggle-voice"><b>Voice mode</b><small>Talk naturally — Parley listens, replies, and acts.</small></label>
    <label class="switch"><input type="checkbox" id="toggle-voice"><span class="slider"></span></label>
  </div>
</div>

<div class="hint">Start the backend with <code>npm run server</code>, then reload the extension after updates.</div>
<script src="popup.js"></script>
